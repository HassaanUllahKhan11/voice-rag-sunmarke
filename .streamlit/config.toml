[server]
# Allow connections from localhost
address = "localhost"
port = 8501
# Enable CORS for local development
enableCORS = false
enableXsrfProtection = false

[browser]
# Automatically open browser
gatherUsageStats = false

[theme]
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"
